spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: enterprise-knowledge-assistant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_assistant}
    username: ${DB_USERNAME:knowledge}
    password: ${DB_PASSWORD:knowledge}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  storage:
    documents-path: ${DOCUMENT_STORAGE_PATH:storage/documents}
  ingestion:
    chunk-size: ${INGESTION_CHUNK_SIZE:1200}
    chunk-overlap: ${INGESTION_CHUNK_OVERLAP:200}
  ai:
    grok:
      api-key: ${GROK_API_KEY:${XAI_API_KEY:}}
      base-url: ${GROK_BASE_URL:https://api.x.ai/v1}
      model: ${GROK_MODEL:grok-2-latest}
      timeout-seconds: ${GROK_TIMEOUT_SECONDS:60}
      max-tokens: ${GROK_MAX_TOKENS:4096}
      temperature: ${GROK_TEMPERATURE:0.2}
      max-retries: ${GROK_MAX_RETRIES:3}
    google:
      api-key: ${GOOGLE_API_KEY:}
      embedding-model: ${EMBEDDING_MODEL:google-embedding-2}
    huggingface:
      token: ${HF_TOKEN:}
      generation-model: ${HF_GENERATION_MODEL:Qwen/Qwen3-30B-A3B-Instruct-2507}
    embedding:
      service-url: ${EMBEDDING_SERVICE_URL:http://127.0.0.1:8001}
      model: ${EMBEDDING_MODEL:all-mpnet-base-v2}
      dimensions: ${EMBEDDING_DIMENSIONS:768}
      timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}
      batch-size: ${EMBEDDING_BATCH_SIZE:32}
      max-retries: ${EMBEDDING_MAX_RETRIES:3}
    reranker:
      model: ${RERANKER_MODEL:cross-encoder/ms-marco-MiniLM-L-6-v2}
      minimum-score: ${RERANKER_MINIMUM_SCORE:-4.0}
    retrieval:
      minimum-similarity: ${RETRIEVAL_MINIMUM_SIMILARITY:0.40}
      dense-candidates: ${RETRIEVAL_DENSE_CANDIDATES:15}
      sparse-candidates: ${RETRIEVAL_SPARSE_CANDIDATES:15}
      fusion-candidates: ${RETRIEVAL_FUSION_CANDIDATES:12}
      top-k: ${RETRIEVAL_TOP_K:5}
      max-context-tokens: ${RETRIEVAL_MAX_CONTEXT_TOKENS:3500}
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-development-secret-key-please}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
