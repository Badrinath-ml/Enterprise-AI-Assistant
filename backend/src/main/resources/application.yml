spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: enterprise-knowledge-assistant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_assistant}
    username: ${DB_USERNAME:knowledge}
    password: ${DB_PASSWORD:knowledge}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  storage:
    documents-path: ${DOCUMENT_STORAGE_PATH:storage/documents}
  ingestion:
    chunk-size: ${INGESTION_CHUNK_SIZE:1200}
    chunk-overlap: ${INGESTION_CHUNK_OVERLAP:200}
  security:
    jwt:
      # Replace this in any real deployment with a strong secret of >= 32 bytes.
      secret: ${JWT_SECRET:change-this-development-secret-key-please}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
