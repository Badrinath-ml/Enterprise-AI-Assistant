services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: eka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_assistant
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
