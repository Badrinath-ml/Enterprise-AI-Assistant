services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: eka-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-knowledge_assistant}
      POSTGRES_USER: ${DB_USER:-knowledge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-knowledge_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-knowledge} -d ${DB_NAME:-knowledge_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eka-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-knowledge_assistant}
      DB_USERNAME: ${DB_USER:-knowledge}
      DB_PASSWORD: ${DB_PASSWORD:-knowledge_secret_password}
      JWT_SECRET: ${JWT_SECRET:-please_set_a_strong_production_secret_32_bytes_min}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-google-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-2-latest}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.x.ai/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_GENERATION_MODEL: ${HF_GENERATION_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      DOCUMENT_STORAGE_PATH: /app/storage/documents
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage/documents

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: eka-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_prod_data:
  backend_storage:
